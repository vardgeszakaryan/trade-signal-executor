[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-singal-executor"
version = "0.1.0"
description = "An autonomous system built for trade execution automation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "telethon>=1.44.0",
]

[dependency-groups]
dev = [
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
